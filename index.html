<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameBoy 經典俄羅斯方塊</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }

        .handheld-shell {
            background-color: #d1c7bd;
            border: 4px solid #8c8275;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 330px;
        }

        .brand-title {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .screen-frame {
            background-color: #8b956d;
            border: 4px solid #3e4431;
            border-radius: 6px;
            padding: 6px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            position: relative;
        }

        /* 統一的大畫布，包含遊戲區與右側資訊欄 */
        canvas#tetris {
            display: block;
            background: #9cad78;
        }

        .overlay-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            background: rgba(156, 173, 120, 0.95);
            color: #111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100px;
            border: 2px dashed #2c3220;
        }

        .overlay-screen h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: #a63a3a;
        }

        .overlay-screen p {
            margin: 0;
            font-size: 10px;
            color: #333;
            line-height: 1.4;
        }

        .controls-area {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            align-items: center;
        }

        .d-pad {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .pad-btn {
            position: absolute;
            background-color: #4a453f;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #2b2723;
            user-select: none;
            -webkit-user-select: none;
        }

        .pad-btn:active {
            box-shadow: 0 1px 0 #2b2723;
            transform: translateY(2px);
        }

        #btnUp { top: 0; left: 30px; width: 40px; height: 32px; border-radius: 4px 4px 0 0; }
        #btnDown { bottom: 0; left: 30px; width: 40px; height: 32px; border-radius: 0 0 4px 4px; }
        #btnLeft { top: 32px; left: 0; width: 32px; height: 40px; border-radius: 4px 0 0 4px; }
        #btnRight { top: 32px; right: 0; width: 32px; height: 40px; border-radius: 0 4px 4px 0; }
        
        .pad-center {
            position: absolute;
            top: 32px;
            left: 32px;
            width: 36px;
            height: 36px;
            background-color: #4a453f;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-right: 5px;
        }

        .action-btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            background-color: #8b3a62;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 0 #542239;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .action-btn:active {
            box-shadow: 0 1px 0 #542239;
            transform: translateY(3px);
        }

        .action-btn.yellow {
            background-color: #b38f27;
            box-shadow: 0 4px 0 #735a17;
            font-size: 10px;
            width: 40px;
            height: 40px;
        }
        .action-btn.yellow:active {
            box-shadow: 0 1px 0 #735a17;
        }

        .btn-label {
            font-size: 10px;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="handheld-shell">
        <div class="brand-title">★ TETRIS CLASSIC ★</div>
        
        <div class="screen-frame">
            <!-- 單一主畫布：寬 210, 高 280 (左側 140 遊戲區 + 右側 70 資訊面板) -->
            <canvas id="tetris" width="210" height="280"></canvas>
            
            <div id="gameOverOverlay" class="overlay-screen">
                <h3>GAME OVER</h3>
                <p>點擊任意按鈕<br>重新開始</p>
            </div>

            <div id="pauseOverlay" class="overlay-screen">
                <h3 style="color: #3a69a6;">PAUSED</h3>
                <p>遊戲暫停中<br>點擊暫停繼續</p>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <button class="pad-btn" id="btnUp">▲</button>
                <button class="pad-btn" id="btnLeft">◀</button>
                <div class="pad-center"></div>
                <button class="pad-btn" id="btnRight">▶</button>
                <button class="pad-btn" id="btnDown">▼</button>
            </div>

            <div class="action-buttons">
                <div class="action-btn-group">
                    <button class="action-btn yellow" id="btnPause">暫停</button>
                    <span class="btn-label">SELECT</span>
                </div>
                <div class="action-btn-group">
                    <button class="action-btn" id="btnRotate">轉旋</button>
                    <span class="btn-label">B</span>
                </div>
                <div class="action-btn-group">
                    <button class="action-btn" id="btnDrop">落下</button>
                    <span class="btn-label">A</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const blockSize = 14; 
        context.scale(blockSize, blockSize);

        let isGameOver = false;
        let isPaused = false;

        const arena = createMatrix(15, 20); // 10格遊戲區 + 5格右側面板空間

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            nextMatrix: null,
            score: 0,
        };

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            } else if (type === 'O') {
                return [[2, 2], [2, 2]];
            } else if (type === 'L') {
                return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
            } else if (type === 'J') {
                return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
            } else if (type === 'I') {
                return [[0, 0, 0, 0], [5, 5, 5, 5], [0, 0, 0, 0], [0, 0, 0, 0]];
            } else if (type === 'S') {
                return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            } else if (type === 'Z') {
                return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
            }
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = '#2c3220';
                        context.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                    }
                });
            });
        }

        function drawUI() {
            // 繪製右側面板分隔線
            context.fillStyle = '#3e4431';
            context.fillRect(10, 0, 0.2, 20);

            // 顯示 SCORE
            context.font = '0.7px "Courier New"';
            context.fillStyle = '#222';
            context.fillText('SCORE', 11.2, 1.5);
            
            context.fillStyle = '#7a8a5e';
            context.fillRect(11, 2, 3.5, 2);
            context.strokeStyle = '#3e4431';
            context.lineWidth = 0.1;
            context.strokeRect(11, 2, 3.5, 2);

            context.fillStyle = '#111';
            context.font = 'bold 0.9px "Courier New"';
            context.fillText(player.score, 11.5, 3.3);

            // 顯示 NEXT 預告
            context.font = '0.7px "Courier New"';
            context.fillStyle = '#222';
            context.fillText('NEXT', 11.8, 5.5);

            context.fillStyle = '#7a8a5e';
            context.fillRect(11, 6, 3.5, 4);
            context.strokeRect(11, 6, 3.5, 4);

            if (player.nextMatrix) {
                const offsetX = 11 + (3.5 - player.nextMatrix[0].length) / 2;
                const offsetY = 6 + (4 - player.nextMatrix.length) / 2;
                drawMatrix(player.nextMatrix, {x: offsetX, y: offsetY});
            }

            // 顯示 LEVEL
            context.font = '0.7px "Courier New"';
            context.fillStyle = '#222';
            context.fillText('LEVEL', 11.5, 11.5);

            context.fillStyle = '#7a8a5e';
            context.fillRect(11, 12, 3.5, 2);
            context.strokeRect(11, 12, 3.5, 2);

            context.fillStyle = '#111';
            context.font = 'bold 0.9px "Courier New"';
            context.fillText(Math.floor(player.score / 50) + 1, 12.5, 13.3);
        }

        function draw() {
            context.fillStyle = '#9cad78';
            context.fillRect(0, 0, canvas.width / blockSize, canvas.height / blockSize);

            // 僅繪製左側 10 欄作為遊戲網格內容
            for (let y = 0; y < 20; y++) {
                for (let x = 0; x < 10; x++) {
                    if (arena[y][x] !== 0) {
                        context.fillStyle = '#2c3220';
                        context.fillRect(x, y, 0.9, 0.9);
                    }
                }
            }

            if (player.matrix) {
                drawMatrix(player.matrix, player.pos);
            }

            drawUI();
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < 10; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function playerDrop() {
            if (isGameOver || isPaused) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerDropInstant() {
            if (isGameOver || isPaused) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (isGameOver || isPaused) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function getRandomPiece() {
            const pieces = 'TJLOSZI';
            return createPiece(pieces[(pieces.length * Math.random()) | 0]);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pauseOverlay').style.display = isPaused ? 'flex' : 'none';
        }

        function restartGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            isGameOver = false;
            isPaused = false;
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('pauseOverlay').style.display = 'none';
            player.nextMatrix = null;
            playerReset();
        }

        function playerReset() {
            if (!player.nextMatrix) {
                player.matrix = getRandomPiece();
            } else {
                player.matrix = player.nextMatrix;
            }
            player.nextMatrix = getRandomPiece();

            player.pos.y = 0;
            player.pos.x = (10 / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                triggerGameOver();
            }
        }

        function playerRotate(dir) {
            if (isGameOver || isPaused) return;
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        let dropCounter = 0;
        let dropInterval = 800;
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (!isGameOver && !isPaused) {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }
            } else {
                lastTime = time;
            }

            draw();
            requestAnimationFrame(update);
        }

        // 鍵盤操控
        document.addEventListener('keydown', event => {
            if (event.key === 'p' || event.key === 'P') {
                togglePause();
                return;
            }
            if (isGameOver) {
                restartGame();
                return;
            }
            if (isPaused) return;

            if (event.key === 'ArrowLeft') playerMove(-1);
            else if (event.key === 'ArrowRight') playerMove(1);
            else if (event.key === 'ArrowDown') playerDrop();
            else if (event.key === 'ArrowUp') playerRotate(1);
            else if (event.code === 'Space') playerDropInstant();
        });

        // 觸控按鈕事件
        document.getElementById('btnPause').addEventListener('click', togglePause);
        document.getElementById('btnRotate').addEventListener('click', () => { if(isGameOver){ restartGame(); } else { playerRotate(1); } });
        document.getElementById('btnDrop').addEventListener('click', () => { if(isGameOver){ restartGame(); } else { playerDropInstant(); } });
        
        document.getElementById('btnLeft').addEventListener('click', () => playerMove(-1));
        document.getElementById('btnRight').addEventListener('click', () => playerMove(1));
        document.getElementById('btnDown').addEventListener('click', () => playerDrop());
        document.getElementById('btnUp').addEventListener('click', () => playerRotate(1));

        document.getElementById('gameOverOverlay').addEventListener('click', restartGame);

        playerReset();
        update();
    </script>
</body>
</html>
