<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>復古掌機版俄羅斯方塊 (含暫停功能)</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }

        .handheld-shell {
            background-color: #d1c7bd;
            border: 4px solid #8c8275;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 350px;
        }

        .brand-title {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .screen-frame {
            background-color: #8b956d;
            border: 4px solid #3e4431;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            gap: 8px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            position: relative;
        }

        canvas#tetris {
            display: block;
            background: #9cad78;
            border: 2px solid #3e4431;
        }

        /* 提示覆蓋層（通用於 GAME OVER 與 PAUSE） */
        .overlay-screen {
            position: absolute;
            top: 50%;
            left: 6px;
            transform: translateY(-50%);
            width: 140px;
            background: rgba(156, 173, 120, 0.95);
            color: #111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100px;
            border: 2px dashed #2c3220;
        }

        .overlay-screen h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            letter-spacing: 1px;
            color: #a63a3a;
        }

        .overlay-screen p {
            margin: 0;
            font-size: 9px;
            color: #333;
            line-height: 1.4;
        }

        .lcd-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 85px;
            font-size: 10px;
            color: #222;
        }

        .lcd-box {
            background: #7a8a5e;
            border: 2px solid #3e4431;
            padding: 3px;
            border-radius: 3px;
            text-align: center;
        }

        .lcd-box span {
            display: block;
            font-weight: bold;
            font-size: 13px;
            color: #111;
        }

        #nextCanvas {
            background: #7a8a5e;
            display: block;
            margin: 2px auto 0 auto;
        }

        .controls-area {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            align-items: center;
        }

        .d-pad {
            position: relative;
            width: 110px;
            height: 110px;
        }

        .pad-btn {
            position: absolute;
            background-color: #4a453f;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #2b2723;
            user-select: none;
            -webkit-user-select: none;
        }

        .pad-btn:active {
            box-shadow: 0 1px 0 #2b2723;
            transform: translateY(2px);
        }

        #btnUp { top: 0; left: 35px; width: 40px; height: 35px; border-radius: 4px 4px 0 0; }
        #btnDown { bottom: 0; left: 35px; width: 40px; height: 35px; border-radius: 0 0 4px 4px; }
        #btnLeft { top: 35px; left: 0; width: 35px; height: 40px; border-radius: 4px 0 0 4px; }
        #btnRight { top: 35px; right: 0; width: 35px; height: 40px; border-radius: 0 4px 4px 0; }
        
        .pad-center {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 40px;
            height: 40px;
            background-color: #4a453f;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-btn {
            width: 52px;
            height: 52px;
            background-color: #a63a3a;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 4px 0 #6e2525;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .action-btn:active {
            box-shadow: 0 1px 0 #6e2525;
            transform: translateY(3px);
        }

        .action-btn.blue {
            background-color: #3a69a6;
            box-shadow: 0 4px 0 #23426e;
        }
        .action-btn.blue:active {
            box-shadow: 0 1px 0 #23426e;
        }

        .action-btn.yellow {
            background-color: #b38f27;
            box-shadow: 0 4px 0 #735a17;
            font-size: 9px;
        }
        .action-btn.yellow:active {
            box-shadow: 0 1px 0 #735a17;
        }
    </style>
</head>
<body>

    <div class="handheld-shell">
        <div class="brand-title">★ TETRIS HANDHELD ★</div>
        
        <div class="screen-frame">
            <canvas id="tetris" width="140" height="280"></canvas>
            
            <!-- GAME OVER 畫面 -->
            <div id="gameOverOverlay" class="overlay-screen">
                <h3>GAME OVER</h3>
                <p>按下任意鍵<br>重新開始</p>
            </div>

            <!-- PAUSE 暫停畫面 -->
            <div id="pauseOverlay" class="overlay-screen">
                <h3 style="color: #3a69a6;">PAUSED</h3>
                <p>遊戲暫停中<br>點擊暫停鍵繼續</p>
            </div>

            <div class="lcd-panel">
                <div class="lcd-box">
                    SCORE
                    <span id="score">0</span>
                </div>
                
                <div class="lcd-box" style="margin-top: 5px;">
                    NEXT
                    <canvas id="nextCanvas" width="56" height="56"></canvas>
                </div>

                <div class="lcd-box" style="margin-top: 5px;">
                    LV
                    <span id="level">1</span>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <button class="pad-btn" id="btnUp">▲</button>
                <button class="pad-btn" id="btnLeft">◀</button>
                <div class="pad-center"></div>
                <button class="pad-btn" id="btnRight">▶</button>
                <button class="pad-btn" id="btnDown">▼</button>
            </div>

            <div class="action-buttons">
                <button class="action-btn yellow" id="btnPause">暫 停</button>
                <button class="action-btn blue" id="btnRotate">轉 旋</button>
                <button class="action-btn" id="btnDrop">落 下</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const blockSize = 14; 
        context.scale(blockSize, blockSize);

        const nextCanvas = document.getElementById('nextCanvas');
        const nextContext = nextCanvas.getContext('2d');
        nextContext.scale(14, 14);

        let isGameOver = false;
        let isPaused = false;

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = Math.floor(player.score / 50) + 1;
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            } else if (type === 'O') {
                return [[2, 2], [2, 2]];
            } else if (type === 'L') {
                return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
            } else if (type === 'J') {
                return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
            } else if (type === 'I') {
                return [[0, 0, 0, 0], [5, 5, 5, 5], [0, 0, 0, 0], [0, 0, 0, 0]];
            } else if (type === 'S') {
                return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            } else if (type === 'Z') {
                return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
            }
        }

        function drawMatrix(ctx, matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = '#2c3220';
                        ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#9cad78';
            context.fillRect(0, 0, canvas.width / blockSize, canvas.height / blockSize);

            drawMatrix(context, arena, {x: 0, y: 0});
            drawMatrix(context, player.matrix, player.pos);

            nextContext.fillStyle = '#7a8a5e';
            nextContext.fillRect(0, 0, 4, 4);
            if (player.nextMatrix) {
                const offsetX = (4 - player.nextMatrix[0].length) / 2;
                const offsetY = (4 - player.nextMatrix.length) / 2;
                drawMatrix(nextContext, player.nextMatrix, {x: offsetX, y: offsetY});
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function playerDrop() {
            if (isGameOver || isPaused) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerDropInstant() {
            if (isGameOver || isPaused) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (isGameOver || isPaused) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function getRandomPiece() {
            const pieces = 'TJLOSZI';
            return createPiece(pieces[(pieces.length * Math.random()) | 0]);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            const pauseOverlay = document.getElementById('pauseOverlay');
            pauseOverlay.style.display = isPaused ? 'flex' : 'none';
        }

        function restartGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            isGameOver = false;
            isPaused = false;
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('pauseOverlay').style.display = 'none';
            player.nextMatrix = null;
            playerReset();
            updateScore();
        }

        function playerReset() {
            if (!player.nextMatrix) {
                player.matrix = getRandomPiece();
            } else {
                player.matrix = player.nextMatrix;
            }
            player.nextMatrix = getRandomPiece();

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                triggerGameOver();
            }
        }

        function playerRotate(dir) {
            if (isGameOver || isPaused) return;
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        let dropCounter = 0;
        let dropInterval = 800;
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (!isGameOver && !isPaused) {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }
                draw();
            } else if (isPaused) {
                // 暫停時短暫更新時間基準避免恢復時突然大掉落
                lastTime = time;
            }

            requestAnimationFrame(update);
        }

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            nextMatrix: null,
            score: 0,
        };

        // 鍵盤操控
        document.addEventListener('keydown', event => {
            if (event.key === 'p' || event.key === 'P') {
                togglePause();
                return;
            }
            if (isGameOver) {
                restartGame();
                return;
            }
            if (isPaused) return;

            if (event.key === 'ArrowLeft') playerMove(-1);
            else if (event.key === 'ArrowRight') playerMove(1);
            else if (event.key === 'ArrowDown') playerDrop();
            else if (event.key === 'ArrowUp') playerRotate(1);
            else if (event.code === 'Space') playerDropInstant();
        });

        // 觸控按鈕事件
        document.getElementById('btnPause').addEventListener('click', togglePause);
        
        document.getElementById('btnLeft').addEventListener('click', () => { if(!isGameOver && !isPaused) playerMove(-1); });
        document.getElementById('btnRight').addEventListener('click', () => { if(!isGameOver && !isPaused) playerMove(1); });
        document.getElementById('btnDown').addEventListener('click', () => { if(!isGameOver && !isPaused) playerDrop(); });
        document.getElementById('btnUp').addEventListener('click', () => { if(!isGameOver && !isPaused) playerRotate(1); });
        document.getElementById('btnRotate').addEventListener('click', () => { if(!isGameOver && !isPaused) playerRotate(1); });
        document.getElementById('btnDrop').addEventListener('click', () => { if(!isGameOver && !isPaused) playerDropInstant(); });

        // GAME OVER 畫面點擊任意處可重啟
        document.getElementById('gameOverOverlay').addEventListener('click', restartGame);

        playerReset();
        updateScore();
        update();
    </script>
</body>
</html>
