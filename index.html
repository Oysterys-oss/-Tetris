<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro GameBoy Tetris</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }

        /* 經典 Game Boy 機身外殼 */
        .handheld-shell {
            background-color: #e0ded8;
            border: 4px solid #b5b2a8;
            border-radius: 12px 12px 45px 12px;
            padding: 20px 20px 25px 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 330px;
            position: relative;
        }

        /* 機身頂部卡榫與電源開關條 */
        .handheld-shell::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 20px;
            right: 20px;
            height: 3px;
            background: #cfcdcb;
            box-shadow: 0 2px 0 #b0aeaa;
        }

        /* 螢幕大型黑色鏡面外框 */
        .lens-frame {
            background-color: #2b2d2f;
            border-radius: 6px 6px 30px 6px;
            padding: 14px 12px 12px 12px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 290px;
        }

        /* 螢幕鏡面上方的紅藍裝飾線與文字 */
        .lens-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .lens-lines {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .lens-lines::before, .lens-lines::after {
            content: '';
            height: 2px;
            flex-grow: 1;
        }
        .lens-lines::before { background-color: #9c1c3c; margin-right: 6px; }
        .lens-lines::after { background-color: #1a4c8c; margin-left: 6px; }

        .lens-header span {
            font-family: sans-serif;
            font-size: 7px;
            color: #8c9094;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        /* 鏡面內部左上角的 BATTERY 指示燈 */
        .lens-battery {
            position: absolute;
            top: 24px;
            left: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .led-dot {
            width: 5px;
            height: 5px;
            background-color: #7c1c1c;
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .lens-battery span {
            font-size: 6px;
            color: #8c9094;
            font-family: sans-serif;
            letter-spacing: 0.5px;
        }

        /* 綠色液晶螢幕本體 */
        .screen-lcd {
            background-color: #8b956d;
            border: 3px solid #1a1c1d;
            padding: 4px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            position: relative;
        }

        canvas#tetris {
            display: block;
            background: #9cad78;
        }

        .overlay-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            background: rgba(156, 173, 120, 0.95);
            color: #111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100px;
            border: 2px dashed #2c3220;
        }

        .overlay-screen h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: #a63a3a;
        }

        .overlay-screen p {
            margin: 0;
            font-size: 10px;
            color: #333;
            line-height: 1.4;
        }

        /* 鏡面下方的 Nintendo GAME BOY 商標 */
        .nintendo-logo-area {
            width: 290px;
            padding: 10px 0 6px 15px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .nintendo-brand {
            font-family: sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: 15px;
            color: #111c66;
            letter-spacing: -0.5px;
        }

        .gameboy-brand {
            font-family: sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: 16px;
            color: #111c66;
            letter-spacing: -1px;
        }

        .tm-symbol {
            font-size: 7px;
            font-style: normal;
            font-weight: bold;
            color: #111c66;
            vertical-align: super;
        }

        /* 操作區總成 */
        .controls-area {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: flex-end;
            padding: 5px 5px 0 5px;
            position: relative;
            margin-top: 5px;
        }

        .d-pad {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .pad-btn {
            position: absolute;
            background-color: #2b2b2b;
            color: #444;
            border: none;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 #111;
            user-select: none;
        }

        .pad-btn:active {
            box-shadow: 0 0 0 #111;
            transform: translateY(2px);
        }

        #btnUp { top: 0; left: 34px; width: 32px; height: 32px; border-radius: 3px 3px 0 0; }
        #btnDown { bottom: 0; left: 34px; width: 32px; height: 32px; border-radius: 0 0 3px 3px; }
        #btnLeft { top: 34px; left: 0; width: 32px; height: 32px; border-radius: 3px 0 0 3px; }
        #btnRight { top: 34px; right: 0; width: 32px; height: 32px; border-radius: 0 3px 3px 0; }
        
        .pad-center {
            position: absolute;
            top: 34px;
            left: 34px;
            width: 32px;
            height: 32px;
            background-color: #2b2b2b;
        }

        /* 右側操作區容器 (A/B鈕 + Select/Start) */
        .action-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: relative;
            width: 155px;
            height: 110px;
        }

        /* 經典斜向 A/B 鈕 (改為經典桃紅色) */
        .ab-buttons {
            position: absolute;
            top: 0;
            right: 5px;
            display: flex;
            gap: 12px;
            transform: rotate(-25deg);
        }

        .action-btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .action-btn {
            width: 42px;
            height: 42px;
            background-color: #8c1c5c; /* 經典洋紅/桃紅色 */
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 0 #4a0c2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .action-btn:active {
            box-shadow: 0 1px 0 #4a0c2e;
            transform: translateY(3px);
        }

        .btn-label {
            font-size: 9px;
            color: #1a1c66;
            font-weight: bold;
            transform: rotate(25deg);
        }

        /* 置中對齊的 Select / Start 按鈕區 */
        .system-buttons {
            position: absolute;
            bottom: 25px;
            left: 8px;
            display: flex;
            gap: 16px;
            transform: rotate(-25deg);
        }

        .sys-btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .sys-btn {
            width: 36px;
            height: 13px;
            background-color: #8c8c8c;
            border: none;
            border-radius: 7px;
            box-shadow: 0 2px 0 #444;
            cursor: pointer;
            user-select: none;
        }

        .sys-btn:active {
            box-shadow: 0 0 0 #444;
            transform: translateY(2px);
        }

        .sys-label {
            font-size: 7px;
            color: #1a1c66;
            font-weight: bold;
            letter-spacing: 0.5px;
            transform: rotate(25deg);
        }

        /* 右下角 6 道經典喇叭孔 */
        .speaker-grille {
            position: absolute;
            bottom: 5px;
            right: 12px;
            display: flex;
            gap: 5px;
            transform: rotate(-25deg);
        }

        .speaker-slot {
            width: 3px;
            height: 24px;
            background-color: #b0aeaa;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="handheld-shell">
        <!-- 黑色寬螢幕鏡面 -->
        <div class="lens-frame">
            <div class="lens-battery">
                <div class="led-dot"></div>
                <span>BATTERY</span>
            </div>
            
            <div class="lens-header">
                <div class="lens-lines"></div>
                <span>DOT MATRIX WITH STEREO SOUND</span>
            </div>

            <div class="screen-lcd">
                <canvas id="tetris" width="220" height="280"></canvas>
                
                <div id="gameOverOverlay" class="overlay-screen">
                    <h3>GAME OVER</h3>
                    <p>點擊任意按鈕<br>重新開始</p>
                </div>

                <div id="pauseOverlay" class="overlay-screen">
                    <h3 style="color: #3a69a6;">PAUSED</h3>
                    <p>遊戲暫停中<br>點擊暫停繼續</p>
                </div>
            </div>
        </div>

        <!-- 鏡面下方的 Nintendo GAME BOY 標誌 -->
        <div class="nintendo-logo-area">
            <span class="nintendo-brand">Nintendo</span>
            <span class="gameboy-brand">GAME BOY</span>
            <span class="tm-symbol">TM</span>
        </div>

        <!-- 操作按鈕區 -->
        <div class="controls-area">
            <div class="d-pad">
                <button class="pad-btn" id="btnUp">▲</button>
                <button class="pad-btn" id="btnLeft">◀</button>
                <div class="pad-center"></div>
                <button class="pad-btn" id="btnRight">▶</button>
                <button class="pad-btn" id="btnDown">▼</button>
            </div>

            <div class="action-container">
                <div class="ab-buttons">
                    <div class="action-btn-group">
                        <button class="action-btn" id="btnRotate">B</button>
                        <span class="btn-label">B</span>
                    </div>
                    <div class="action-btn-group">
                        <button class="action-btn" id="btnDrop">A</button>
                        <span class="btn-label">A</span>
                    </div>
                </div>

                <div class="system-buttons">
                    <div class="sys-btn-group">
                        <button class="sys-btn" id="btnPause"></button>
                        <span class="sys-label">SELECT</span>
                    </div>
                    <div class="sys-btn-group">
                        <button class="sys-btn" id="btnRestart"></button>
                        <span class="sys-label">START</span>
                    </div>
                </div>

                <!-- 喇叭孔 -->
                <div class="speaker-grille">
                    <div class="speaker-slot"></div>
                    <div class="speaker-slot"></div>
                    <div class="speaker-slot"></div>
                    <div class="speaker-slot"></div>
                    <div class="speaker-slot"></div>
                    <div class="speaker-slot"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const blockSize = 14; 
        context.scale(blockSize, blockSize);

        let isGameOver = false;
        let isPaused = false;

        const arena = createMatrix(14, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            nextMatrix: null,
            score: 0,
        };

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            else if (type === 'O') return [[2, 2], [2, 2]];
            else if (type === 'L') return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
            else if (type === 'J') return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
            else if (type === 'I') return [[0, 0, 0, 0], [5, 5, 5, 5], [0, 0, 0, 0], [0, 0, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = '#2c3220';
                        context.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                    }
                });
            });
        }

        function drawUI() {
            context.fillStyle = '#3e4431';
            context.fillRect(9.8, 0, 0.2, 20);

            context.font = '0.7px "Courier New"';
            context.fillStyle = '#222';
            context.fillText('SCORE', 10.8, 1.5);
            
            context.fillStyle = '#7a8a5e';
            context.fillRect(10.5, 2, 3.2, 2);
            context.strokeStyle = '#3e4431';
            context.lineWidth = 0.1;
            context.strokeRect(10.5, 2, 3.2, 2);

            context.fillStyle = '#111';
            context.font = 'bold 0.9px "Courier New"';
            context.fillText(player.score, 10.9, 3.3);

            context.font = '0.7px "Courier New"';
            context.fillStyle = '#222';
            context.fillText('NEXT', 11.2, 5.5);

            context.fillStyle = '#7a8a5e';
            context.fillRect(10.5, 6, 3.2, 4);
            context.strokeRect(10.5, 6, 3.2, 4);

            if (player.nextMatrix) {
                const offsetX = 10.5 + (3.2 - player.nextMatrix[0].length) / 2;
                const offsetY = 6 + (4 - player.nextMatrix.length) / 2;
                drawMatrix(player.nextMatrix, {x: offsetX, y: offsetY});
            }

            context.font = '0.7px "Courier New"';
            context.fillStyle = '#222';
            context.fillText('LEVEL', 11.0, 11.5);

            context.fillStyle = '#7a8a5e';
            context.fillRect(10.5, 12, 3.2, 2);
            context.strokeRect(10.5, 12, 3.2, 2);

            context.fillStyle = '#111';
            context.font = 'bold 0.9px "Courier New"';
            context.fillText(Math.floor(player.score / 50) + 1, 11.8, 13.3);
        }

        function draw() {
            context.fillStyle = '#9cad78';
            context.fillRect(0, 0, canvas.width / blockSize, canvas.height / blockSize);

            for (let y = 0; y < 20; y++) {
                for (let x = 0; x < 10; x++) {
                    if (arena[y][x] !== 0) {
                        context.fillStyle = '#2c3220';
                        context.fillRect(x, y, 0.9, 0.9);
                    }
                }
            }

            if (player.matrix) {
                drawMatrix(player.matrix, player.pos);
            }

            drawUI();
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < 10; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function playerDrop() {
            if (isGameOver || isPaused) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerDropInstant() {
            if (isGameOver || isPaused) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (isGameOver || isPaused) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function getRandomPiece() {
            const pieces = 'TJLOSZI';
            return createPiece(pieces[(pieces.length * Math.random()) | 0]);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pauseOverlay').style.display = isPaused ? 'flex' : 'none';
        }

        function restartGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            isGameOver = false;
            isPaused = false;
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('pauseOverlay').style.display = 'none';
            player.nextMatrix = null;
            playerReset();
        }

        function playerReset() {
            if (!player.nextMatrix) {
                player.matrix = getRandomPiece();
            } else {
                player.matrix = player.nextMatrix;
            }
            player.nextMatrix = getRandomPiece();

            player.pos.y = 0;
            player.pos.x = (10 / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                triggerGameOver();
            }
        }

        function playerRotate(dir) {
            if (isGameOver || isPaused) return;
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        let dropCounter = 0;
        let dropInterval = 800;
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (!isGameOver && !isPaused) {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }
            } else {
                lastTime = time;
            }

            draw();
            requestAnimationFrame(update);
        }

        // 鍵盤操控
        document.addEventListener('keydown', event => {
            if (event.key === 'p' || event.key === 'P') {
                togglePause();
                return;
            }
            if (isGameOver) {
                restartGame();
                return;
            }
            if (isPaused) return;

            if (event.key === 'ArrowLeft') playerMove(-1);
            else if (event.key === 'ArrowRight') playerMove(1);
            else if (event.key === 'ArrowDown') playerDrop();
            else if (event.key === 'ArrowUp') playerRotate(1);
            else if (event.code === 'Space') playerDropInstant();
        });

        // 按鈕綁定
        document.getElementById('btnPause').addEventListener('click', togglePause);
        document.getElementById('btnRestart').addEventListener('click', restartGame);
        document.getElementById('btnRotate').addEventListener('click', () => { if(isGameOver){ restartGame(); } else { playerRotate(1); } });
        document.getElementById('btnDrop').addEventListener('click', () => { if(isGameOver){ restartGame(); } else { playerDropInstant(); } });
        
        document.getElementById('btnLeft').addEventListener('click', () => playerMove(-1));
        document.getElementById('btnRight').addEventListener('click', () => playerMove(1));
        document.getElementById('btnDown').addEventListener('click', () => playerDrop());
        document.getElementById('btnUp').addEventListener('click', () => playerRotate(1));

        document.getElementById('gameOverOverlay').addEventListener('click', restartGame);

        playerReset();
        update();
    </script>
</body>
</html>
